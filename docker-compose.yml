name: s3_frontend
services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    restart: always
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "0.0.0.0:3060:3000"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/extensions:/directus/extensions
      - ./backend/migrations:/directus/migrations
      - ./backend/templates:/directus/templates
    command: >
        sh -c "node cli.js bootstrap &&
              node cli.js schema apply --yes /directus/migrations/colecciones.yaml &&
              sh /directus/init-modificaciones-db.sh &&
              pm2-runtime start ecosystem.config.cjs"
    restart: always
    ports:
      - "0.0.0.0:8055:8055"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${NEXT_PUBLIC_BACKEND_URL}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: "postgres"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_DATABASE: ${DATABASE_NAME}
      DB_USER: ${DATABASE_USERNAME}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      DB_VERSION: "14"
      WEBSOCKETS_ENABLED: 0
      TELEMETRY: 0
      GRAPHQL_INTROSPECTION: 0
      CACHE_ENABLED: 0
      WEBSOCKETS_GRAPHQL_ENABLED: 0
      CORS_CREDENTIALS: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      CORS_METHODS: "GET,POST,PATCH,DELETE,PUT,OPTIONS"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization,Access-Control-Allow-Origin"

      CORS_EXPOSED_HEADERS: "Content-Range"
      EMAIL_TRANSPORT: sendmail

  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    #ports:
      #- 5432:5432

volumes:
  postgres: {}