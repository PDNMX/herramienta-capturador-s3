services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3060:3000

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/extensions:/directus/extensions
      - ./backend/migrations:/directus/migrations
      - ./backend/templates:/directus/templates
    command: >
        sh -c "node cli.js bootstrap &&
              node cli.js schema apply --yes /directus/migrations/colecciones.yaml &&
              sh /directus/init-modificaciones-db.sh &&
              pm2-runtime start ecosystem.config.cjs"
    restart: always
    ports:
      - 8055:8055
    depends_on:
      - db
    environment:
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${NEXT_PUBLIC_BACKEND_URL}
      DB_CLIENT: "postgres"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_DATABASE: ${DATABASE_NAME}
      DB_USER: ${DATABASE_USERNAME}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      DB_VERSION: "14"
      WEBSOCKETS_ENABLED: 0
      TELEMETRY: 0
      GRAPHQL_INTROSPECTION: 0
      CACHE_ENABLED: 0
      WEBSOCKETS_GRAPHQL_ENABLED: 0
      CORS_CREDENTIALS: 1
      CORS_ENABLED: 1
      CORS_ORIGIN: "*"
      CORS_METHODS: "GET,POST,PATCH,DELETE"
      # EMAIL_FROM: ${EMAIL_FROM}
      # EMAIL_TRANSPORT: ${EMAIL_TRANSPORT}
      # EMAIL_SMTP_HOST: ${SMTP_HOST}
      # EMAIL_SMTP_PORT: ${SMTP_PORT}
      # EMAIL_SMTP_USER: ${SMTP_USER}
      # EMAIL_SMTP_PASSWORD: ${SMTP_PASSWORD}
      # EMAIL_SMTP_SECURE: ${SMTP_SECURE}
      # EMAIL_SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS}

  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    #ports:
      #- 5432:5432

volumes:
  postgres: {}